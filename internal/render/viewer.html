<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--TITLE--></title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--fg:#1f2328;--mut:#656d76;--bd:#d0d7de;--acc:#0969da;
  --add:#2da44e;--mod:#bf8700;--del:#cf222e;--loc:#8250df;--edge:#8c959f;--hl:#0969da;--caller:#bc4c00;--callee:#1a7f37;
  --l-entry:#dbeafe;--l-ui:#fce7f3;--l-domain:#dcfce7;--l-adapter:#fef3c7;--l-infra:#e5e7eb;--l-test:#f3e8ff;--l-other:#f1f5f9;
  --nodefg:#1f2328;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--fg:#e6edf3;--mut:#8b949e;--bd:#30363d;--acc:#58a6ff;
  --add:#3fb950;--mod:#d29922;--del:#f85149;--loc:#a371f7;--edge:#6e7681;--hl:#58a6ff;--caller:#ffa657;--callee:#56d364;
  --l-entry:#17304f;--l-ui:#4a1d37;--l-domain:#173a22;--l-adapter:#47391a;--l-infra:#2a3039;--l-test:#34214f;--l-other:#1e252e;
  --nodefg:#e6edf3;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=search],select{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0}
header .sum{color:var(--mut)}
header .sum b{color:var(--fg)}
.chip{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--bd);margin-left:3px}
.chip.a{color:var(--add);border-color:var(--add)}.chip.m{color:var(--mod);border-color:var(--mod)}.chip.d{color:var(--del);border-color:var(--del)}.chip.l{color:var(--loc);border-color:var(--loc)}
#q{width:260px}
#main{flex:1;display:flex;min-height:0}
#side{width:340px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--bd);min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--bd)}
#tabs button{flex:1;border:0;border-radius:0;background:none;padding:7px 2px;border-bottom:2px solid transparent}
#tabs button.on{background:none;color:var(--acc);border-bottom-color:var(--acc)}
#sidebody{flex:1;overflow:auto;padding:6px 0;min-height:0}
.filters{padding:4px 10px 6px;display:flex;flex-wrap:wrap;gap:4px 12px;border-bottom:1px solid var(--bd);color:var(--mut)}
.filters label{white-space:nowrap}
.row{padding:4px 10px;cursor:pointer;display:flex;gap:6px;align-items:baseline;border-left:3px solid transparent}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--panel2);border-left-color:var(--acc)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--mut);font-size:11px}
.row .cnt{color:var(--mut);font-size:11px}
.st{display:inline-block;width:14px;text-align:center;font-weight:700;font-size:12px}
.st.added{color:var(--add)}.st.modified{color:var(--mod)}.st.deleted{color:var(--del)}
.ent{color:var(--acc);font-size:12px}
.more{padding:6px 10px;color:var(--acc);cursor:pointer}
.sec{padding:6px 10px 2px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#center{flex:1;position:relative;min-width:0;background:var(--bg)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#svg.drag{cursor:grabbing}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#legend{position:absolute;left:10px;top:8px;color:var(--mut);font-size:11px;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px;border:1px solid var(--bd);pointer-events:none}
#detail{width:380px;background:var(--panel);border-left:1px solid var(--bd);overflow:auto;padding:10px 12px;min-height:0}
#detail h2{font-size:14px;margin:2px 0 4px;word-break:break-word}
#detail .kv{color:var(--mut);margin:2px 0}
#detail pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border-radius:6px;padding:6px 8px;margin:6px 0}
#detail .doc{color:var(--fg);margin:6px 0;white-space:pre-wrap}
#detail h3{font-size:12px;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.nb{list-style:none;margin:0;padding:0}
.nb ul{list-style:none;margin:0 0 0 16px;padding:0 0 0 6px;border-left:1px dashed var(--bd)}
.nb li{margin:1px 0}
.nb .it{display:flex;gap:4px;align-items:baseline}
.nb .x{cursor:pointer;color:var(--mut);width:14px;text-align:center;flex:none}
.nb .x:hover{color:var(--acc)}
.nb a,#detail a{color:var(--acc);cursor:pointer;text-decoration:none;word-break:break-word}
.nb a:hover,#detail a:hover{text-decoration:underline}
.tag{font-size:11px;padding:0 5px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);margin-right:4px;color:var(--mut)}
#player{background:var(--panel);border-top:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#player .ctl{display:flex;gap:4px;align-items:center}
#pbar{flex:1;min-width:140px}
#cap{flex-basis:100%;min-height:36px;color:var(--fg)}
#cap .t{font-weight:600}
#cap .s{color:var(--mut)}
/* карта */
.node rect{stroke:var(--bd);stroke-width:1.2;rx:6}
.node text{fill:var(--nodefg);font-size:11px;pointer-events:none}
.node .cnt{fill:var(--mut);font-size:9px}
.node{cursor:pointer}
.node.dim{opacity:.22}
.node.sel rect{stroke:var(--hl);stroke-width:3}
.node.caller rect{stroke:var(--caller);stroke-width:2.5}
.node.callee rect{stroke:var(--callee);stroke-width:2.5}
.node.hit rect{stroke:var(--acc);stroke-width:2.5;stroke-dasharray:4 2}
.node.cur rect{stroke:var(--hl);stroke-width:4}
.node.cur{opacity:1}
.node.trail rect{stroke:var(--hl);stroke-width:2;stroke-dasharray:3 2}
.node.chg-a rect{stroke:var(--add);stroke-width:2.2}
.node.chg-m rect{stroke:var(--mod);stroke-width:2.2}
.node.chg-d rect{stroke:var(--del);stroke-width:2.2}
.badge{font-size:9px;font-weight:700}
.edge{fill:none;stroke:var(--edge);stroke-width:var(--w,1);opacity:.28}
.edge.hot{stroke:var(--hl);opacity:.95;stroke-width:calc(var(--w,1) + .8)}
.edge.in{stroke:var(--caller);opacity:.9;stroke-width:calc(var(--w,1) + .6)}
.edge.out{stroke:var(--callee);opacity:.9;stroke-width:calc(var(--w,1) + .6)}
.node.grp .stack{stroke:var(--bd);stroke-width:1.2;rx:6;opacity:.7}
.node.kid rect:not(.stack){stroke-dasharray:1 3;stroke-width:1.8}
#crumbs{padding:6px 10px;border-bottom:1px solid var(--bd);line-height:1.9}
#crumbs[hidden]{display:none}
#crumbs a{color:var(--acc);cursor:pointer}
#crumbs button{padding:0 7px;font-size:12px}
.edge.dim{opacity:.06}
.glabel{fill:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.glane{fill:var(--panel2);opacity:.45}
.flow{fill:none;stroke:var(--hl);stroke-width:3;stroke-dasharray:8 5;animation:dash .8s linear infinite;marker-end:url(#arr)}
.flow.old{opacity:.35;animation:none;stroke-width:2}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{fill:none;stroke:var(--hl);stroke-width:3;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{opacity:.9;stroke-width:3}to{opacity:0;stroke-width:14}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
#empty{padding:30px;color:var(--mut)}
.live{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--bd);border-radius:12px;color:var(--mut);font-size:12px}
.live[hidden]{display:none}
.live i{width:8px;height:8px;border-radius:50%;background:var(--add)}
.live.building i{background:var(--mod);animation:blink .7s ease-in-out infinite alternate}
.live.error{border-color:var(--del);color:var(--del)}
.live.error i{background:var(--del)}
@keyframes blink{from{opacity:1}to{opacity:.25}}
.node.flash rect:not(.stack){animation:flashn 2.6s ease-out 1}
@keyframes flashn{0%{stroke:var(--hl);stroke-width:7}60%{stroke:var(--hl);stroke-width:4}100%{stroke:var(--bd);stroke-width:1.2}}
.row.flash,#detail.flash{animation:flashr 2.6s ease-out 1}
@keyframes flashr{0%{background:color-mix(in srgb,var(--hl) 55%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.live.building i,.node.flash rect:not(.stack),.row.flash,#detail.flash{animation:none}.node.flash rect:not(.stack){stroke:var(--hl);stroke-width:3}.row.flash{background:color-mix(in srgb,var(--hl) 25%,transparent)}}
</style>
</head>
<body>
<header>
  <h1 id="title"><!--TITLE--></h1>
  <span class="sum" id="sum"></span>
  <span class="live" id="live" hidden title=""><i></i><b>живое</b><span id="liveInfo"></span></span>
  <span style="flex:1"></span>
  <label><input type="checkbox" id="onlyChanged"> только изменённые</label>
  <input type="search" id="q" placeholder="Поиск: функция или файл…" autocomplete="off">
</header>
<div id="main">
  <aside id="side">
    <div id="tabs">
      <button data-tab="mods" class="on">Модули</button>
      <button data-tab="funcs">Функции</button>
      <button data-tab="chg">Изменения</button>
      <button data-tab="play">Видео</button>
    </div>
    <div id="crumbs" hidden></div>
    <div id="sidebody"></div>
  </aside>
  <section id="center">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--hl)"/></marker>
      </defs>
      <g id="cam"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g><g id="over"></g></g>
    </svg>
    <div id="legend">колесо — зум, перетаскивание — пан; размер блока — число функций; стопка — группа модулей (клик раскрывает), толщина связи — число импортов; рамка: <span style="color:var(--add)">добавлено</span> / <span style="color:var(--mod)">изменено</span> / <span style="color:var(--del)">удалено</span></div>
    <div id="zoom"><button id="zin" title="Приблизить">+</button><button id="zout" title="Отдалить">−</button><button id="zfit" title="Вписать">⤢</button></div>
  </section>
  <aside id="detail"><div id="empty">Выберите модуль на карте или функцию в списке.</div></aside>
</div>
<div id="player">
  <div class="ctl">
    <button id="pPrev" title="Шаг назад">⏮</button>
    <button id="pPlay" title="Проиграть / пауза">▶</button>
    <button id="pNext" title="Шаг вперёд">⏭</button>
  </div>
  <select id="pMode" title="Что проигрывать"></select>
  <label>скорость <select id="pSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  <input type="range" id="pbar" min="0" max="0" value="0">
  <span id="pPos" class="mono"></span>
  <div id="cap"></div>
</div>

<script>
"use strict";
const DATA = /*ARCH_DATA*/null;

(function(){
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if (!DATA || !DATA.facts) { $("#sidebody").innerHTML = '<div id="empty">Нет данных: файл нужно собирать командой <code>arch.py render</code>.</div>'; return; }

let F = DATA.facts, M = DATA.model || {};
const LIVE = DATA.serve || null;
let fns = F.functions || {};
let fids = Object.keys(fns);
let MM = M.modules || {};
const LAYERS = ["entry","ui","domain","adapter","infra","test","other"];
const LAYER_RU = {entry:"Входы", ui:"Интерфейс", domain:"Домен", adapter:"Адаптеры", infra:"Инфраструктура", test:"Тесты", other:"Прочее"};
const STATUS_RU = {added:"добавлена", modified:"изменена", deleted:"удалена"};
const modLabel = m => m === "." || m === "" ? "(корень)" : m;
const shortMod = m => { const p = modLabel(m).split("/"); return p.slice(-2).join("/"); };
const fname = f => (f.cls ? f.cls + "." : "") + f.name;

/* ---------- индексы ---------- */
let hasFiles, callers, byMod, changed, entries, deleted, importedBy, modChg, nLocal, nAdded, nMod;
const bump = (m, k) => { const o = modChg[m] = modChg[m] || {added:0, modified:0, deleted:0, local:0}; o[k]++; };
function indexData() {
  fns = F.functions || {}; fids = Object.keys(fns); MM = M.modules || {};
  callers = {}; byMod = {};
  fids.forEach(id => { callers[id] = []; });
  fids.forEach(id => {
    const f = fns[id];
    (byMod[f.module] = byMod[f.module] || []).push(id);
    (f.callees || []).forEach(c => { if (callers[c]) callers[c].push(id); });
  });
  changed = fids.filter(id => fns[id].status);
  // modules without functions (files of languages without a parser) stay on the map
  hasFiles = m => ((F.modules[m] || {}).files || []).length > 0;
  entries = fids.filter(id => fns[id].entry);
  deleted = F.deleted || [];
  importedBy = {};
  Object.keys(F.modules).forEach(a => (F.modules[a].imports || []).forEach(b => { if (a !== b) (importedBy[b] = importedBy[b] || []).push(a); }));
  modChg = {};
  changed.forEach(id => { const f = fns[id]; bump(f.module, f.status); if (f.uncommitted) bump(f.module, "local"); });
  deleted.forEach(d => bump(d.module, "deleted"));
  nLocal = changed.filter(id => fns[id].uncommitted).length;
  nAdded = changed.filter(id => fns[id].status === "added").length;
  nMod = changed.filter(id => fns[id].status === "modified").length;
}
indexData();

/* ---------- состояние ---------- */
const S = {
  tab: "mods", mod: null, fn: null, focus: null, hist: [], q: "", only: false,
  entOnly: false, entKind: "", fMod: null, limit: 200,
  mode: null, steps: [], idx: -1, playing: false, timer: null,
};
const flash = {set: new Set(), mods: new Set(), timer: null}; // что мигает после обновления (serve)

/* ---------- шапка ---------- */
function drawHeader() {
  $("#title").textContent = M.title || (F.repo + " — архитектура");
  document.title = $("#title").textContent;
  $("#sum").innerHTML =
    `<b>${esc(F.repo)}</b> · ветка <b>${esc(F.branch)}</b>${F.base ? " vs <b>" + esc(F.base) + "</b>" : ""} · <code>${esc(F.head)}</code> · ` +
    `модулей <b>${Object.keys(F.modules).length}</b>, функций <b>${fids.length}</b>, точек входа <b>${entries.length}</b> · изменено: ` +
    `<span class="chip a">+${nAdded}</span><span class="chip m">~${nMod}</span><span class="chip d">−${deleted.length}</span><span class="chip l">не в коммите ${nLocal}</span>` +
    (M.summary ? `<br><span>${esc(M.summary)}</span>` : "");
}
drawHeader();

/* ---------- раскладка карты ---------- */
// Группировка: модулей больше GROUP_MIN — на карте группы по префиксу пути.
// Дерево путей; стартовый срез жадно дробит самую крупную ветку, пока блоков <= GROUP_TARGET.
const GROUP_MIN = 60, GROUP_TARGET = 40;
let allMods = Object.keys(F.modules);
let grouping = allMods.length > GROUP_MIN;
const TN = {}, modNode = {}, userOpen = new Set(), initOpen = new Set();
let TROOT = null;
const isGid = id => id.startsWith("g:");
function buildTrie() {
  const mk = path => ({id: "g:" + path, path, parent: null, kids: new Map(), own: [], mods: [], n: 0, label: path});
  const root = mk("");
  allMods.forEach(m => {
    let node = root;
    if (m !== "." && m !== "") {
      let path = "";
      m.split("/").forEach(seg => {
        path = path ? path + "/" + seg : seg;
        if (!node.kids.has(seg)) node.kids.set(seg, mk(path));
        node = node.kids.get(seg);
      });
    }
    node.own.push(m);
  });
  const compress = (n, top) => {
    n.kids = [...n.kids.values()].map(k => compress(k, false)).sort((a, b) => a.path < b.path ? -1 : 1);
    return (!top && !n.own.length && n.kids.length === 1) ? n.kids[0] : n;
  };
  const fin = (n, parent) => {
    n.parent = parent;
    n.label = parent && parent.path ? n.path.slice(parent.path.length + 1) : n.path;
    n.kids.forEach(k => fin(k, n));
    n.mods = n.own.concat(...n.kids.map(k => k.mods));
    n.n = n.own.reduce((s, m) => s + (byMod[m] || []).length, 0) + n.kids.reduce((s, k) => s + k.n, 0);
    TN[n.id] = n;
    n.own.forEach(m => { modNode[m] = n; });
  };
  const r = compress(root, true);
  fin(r, null);
  // жадный стартовый срез
  let size = 1, cut = [r];
  const blocked = new Set();
  initOpen.add(r.id);
  cut = r.kids.slice(); size = r.own.length + r.kids.length; // корень раскрыт всегда
  for (;;) {
    const cand = cut.filter(n => n.mods.length > 1 && !blocked.has(n.id)).sort((a, b) => b.mods.length - a.mods.length)[0];
    if (!cand) break;
    const delta = cand.own.length + cand.kids.length - 1;
    if (size + delta > GROUP_TARGET) { blocked.add(cand.id); continue; }
    cut = cut.filter(n => n !== cand).concat(cand.kids);
    size += delta; initOpen.add(cand.id);
  }
  return r;
}
if (grouping) TROOT = buildTrie();
const isOpen = n => initOpen.has(n.id) || userOpen.has(n.id);

let units = [], U = {}, unitOf = {}, nodeMods = [], edgeList = [], outE = {}, inE = {}, edgeOf = {}, depth = {}, useLayers = false;
let POS = {}, lanes = [];
const sumChg = mods => {
  const o = {added: 0, modified: 0, deleted: 0, local: 0};
  mods.forEach(m => { const c = modChg[m]; if (c) for (const k in o) o[k] += c[k]; });
  return o;
};
// описание из модели: сам путь или ближайший предок
function modelFor(path) {
  for (let p = path; p; p = p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "") if (MM[p]) return MM[p];
  return null;
}
function unitInfo(u) {
  if (u.kind === "m") return MM[u.id] || null;
  return modelFor(u.node.path);
}
function unitLayer(u) {
  const i = unitInfo(u);
  if (i && LAYERS.includes(i.layer)) return i.layer;
  if (u.kind === "g") { // большинство слоёв у модулей группы
    const c = {};
    u.mods.forEach(m => { const l = MM[m] && MM[m].layer; if (LAYERS.includes(l)) c[l] = (c[l] || 0) + 1; });
    const best = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    if (best) return best;
  }
  return null;
}
function computeUnits() {
  units = []; U = {}; unitOf = {};
  const add = u => { u.chg = sumChg(u.mods); units.push(u); U[u.id] = u; u.mods.forEach(m => { unitOf[m] = u.id; }); };
  const modUnit = m => add({id: m, kind: "m", mods: [m], label: shortMod(m), n: (byMod[m] || []).length});
  if (!grouping) {
    allMods.filter(m => (byMod[m] && byMod[m].length) || modChg[m] || hasFiles(m)).forEach(modUnit);
    return;
  }
  const visit = n => {
    if (n.mods.length === 1 && n.parent) { modUnit(n.mods[0]); return; }
    if (n.parent && !isOpen(n)) { add({id: n.id, kind: "g", node: n, mods: n.mods, label: n.label, n: n.n, nm: n.mods.length}); return; }
    n.own.forEach(modUnit);
    n.kids.forEach(visit);
  };
  visit(TROOT);
}
function computeGraph() {
  computeUnits();
  nodeMods = units.map(u => u.id);
  const w = new Map();
  units.forEach(u => u.mods.forEach(a => ((F.modules[a] || {}).imports || []).forEach(b => {
    const ub = unitOf[b];
    if (ub && ub !== u.id) w.set(u.id + "\u0000" + ub, (w.get(u.id + "\u0000" + ub) || 0) + 1);
  })));
  edgeList = [...w.entries()].map(([k, c]) => { const p = k.split("\u0000"); return [p[0], p[1], c]; });
  outE = {}; inE = {}; edgeOf = {};

/* ---------- группы: раскрытие, крошки ---------- */
function closeBelow(n) {
  [...userOpen].forEach(id => { const x = TN[id]; if (x !== n && (!n.path || x.path.startsWith(n.path + "/"))) userOpen.delete(id); });
}
function renderCrumbs() {
  const c = $("#crumbs");
  if (!grouping) { c.hidden = true; return; }
  c.hidden = false;
  const chain = [];
  for (let n = S.focus; n && n.parent; n = n.parent) chain.unshift(n);
  c.innerHTML = `<div class="kv">на карте ${units.length} блоков из ${allMods.length} модулей (${units.filter(u => u.kind === "g").length} групп)</div>` +
    `<a data-crumb="">все</a>` + chain.map(n => ` › <a data-crumb="${esc(n.id)}" title="${esc(n.path)}">${esc(n.label)}</a>`).join("") +
    (S.focus && userOpen.has(S.focus.id) ? ` <button data-collapse>свернуть</button>` : "") +
    (userOpen.size ? ` <button data-collapseall>свернуть всё</button>` : "");
}
function afterRebuild(boxOf) {
  fit();
  if (boxOf) {
    const set = new Set(boxOf.mods), ps = units.filter(u => set.has(u.mods[0])).map(u => POS[u.id]);
    if (ps.length) {
      const x1 = Math.min(...ps.map(p => p.x)), y1 = Math.min(...ps.map(p => p.y));
      const x2 = Math.max(...ps.map(p => p.x + p.w)), y2 = Math.max(...ps.map(p => p.y + p.h));
      panToBox({x: x1, y: y1, w: x2 - x1, h: y2 - y1}, true);
    }
  }
  renderCrumbs(); renderDetail(); renderSide(); paintMap();
}
function expandGroup(n) {
  if (!n) return;
  if (!isOpen(n)) userOpen.add(n.id);
  S.focus = n; S.fn = null; S.mod = null; S.fMod = null; S.hist = []; S.limit = 200;
  if (S.tab !== "funcs") S.tab = "mods";
  rebuild(); afterRebuild(n);
}
function collapseGroup(n) {
  closeBelow(n); userOpen.delete(n.id);
  S.focus = n; S.fn = null; S.mod = null; S.fMod = null;
  rebuild(); afterRebuild(null);
}
function focusCrumb(n) { // n == null — корень
  S.focus = n; S.fMod = null; S.limit = 200;
  if (n) { closeBelow(n); rebuild(); afterRebuild(n); } else { renderCrumbs(); renderDetail(); renderSide(); paintMap(); }
}
function collapseAll() {
  userOpen.clear(); S.focus = null; S.fn = null; S.mod = null; S.fMod = null; S.hist = [];
  rebuild(); afterRebuild(null);
}
// выбор функции/модуля раскрывает группы на пути к нему (проигрывание — нет)
function revealMod(m) {
  const n = grouping && modNode[m];
  if (!n) return false;
  let deepest = null;
  for (let a = n.mods.length > 1 ? n : n.parent; a && a.parent; a = a.parent) {
    if (!isOpen(a)) { userOpen.add(a.id); if (!deepest) deepest = a; }
  }
  if (!deepest) return false;
  S.focus = deepest;
  rebuild(); fit(); renderCrumbs();
  return true;
}
$("#crumbs").addEventListener("click", e => {
  const a = e.target.closest("[data-crumb]");
  if (a) { focusCrumb(a.dataset.crumb ? TN[a.dataset.crumb] : null); return; }
  if (e.target.closest("[data-collapse]")) collapseGroup(S.focus);
  else if (e.target.closest("[data-collapseall]")) collapseAll();
});

const modInfo = m => {

function selectMod(m, list) {
  const rev = m ? revealMod(m) : false;
  S.mod = m; S.fn = null; S.hist = [];
  if (m && list) { S.fMod = m; S.tab = "funcs"; S.limit = 200; }
  if (!m) S.fMod = null;
  renderDetail(); renderSide(); paintMap();
  if (rev) panTo(m, true);
}
function selectFn(id, push, keepTab) {
  if (!fns[id]) return;
  const rev = revealMod(fns[id].module);
  S.fn = id; S.mod = fns[id].module;
  if (push) S.hist.push(id);
  renderDetail(); paintMap();
  if (!keepTab || rev) renderSide();
  panTo(fns[id].module, rev);
  if (S.tab === "funcs") { const r = side.querySelector(".row.sel"); if (r) r.scrollIntoView({block: "nearest"}); }
}
function back() { S.hist.pop(); const id = S.hist[S.hist.length - 1]; if (id) selectFn(id, false); }

/* ---------- «видео» ---------- */
function buildTour(kind) {
  if (kind.startsWith("flow:")) {
    const fl = M.flows[+kind.slice(5)];
    return {steps: (fl.steps || []).filter(id => fns[id]), name: fl.name, desc: fl.desc || ""};
  }
  // BFS от точек входа по вызовам
  const par = {}, dist = {};
  const q = [];
  entries.forEach(id => { dist[id] = 0; par[id] = null; q.push(id); });
  for (let h = 0; h < q.length; h++) {
    const id = q[h];
    (fns[id].callees || []).forEach(c => { if (dist[c] == null) { dist[c] = dist[id] + 1; par[c] = id; q.push(c); } });
  }
  const steps = [];
  const push = id => { if (steps[steps.length - 1] !== id) steps.push(id); };
  if (kind === "changes") {
    const ch = changed.slice().sort((a, b) => (dist[a] == null ? 1e9 : dist[a]) - (dist[b] == null ? 1e9 : dist[b]) || a.localeCompare(b));
    const seen = new Set();
    for (const id of ch) {
      if (seen.has(id) || steps.length > 400) continue;
      const path = []; for (let c = id; c != null; c = par[c]) path.push(c);
      path.reverse().forEach(p => { push(p); seen.add(p); });
    }
    return {steps, name: "Изменённые функции: путь от точек входа", desc: "Обход изменений ветки в порядке вызовов, начиная с точек входа."};
  }
  // обзор от точек входа: глубина до 4, не более 60 шагов
  const seen = new Set();
  const walk = (id, d) => { if (steps.length >= 60 || seen.has(id) || d > 4) return; seen.add(id); push(id); (fns[id].callees || []).slice(0, 3).forEach(c => walk(c, d + 1)); };
  entries.slice(0, 6).forEach(e => walk(e, 0));
  return {steps, name: "Обзор: вызовы от точек входа", desc: "Нет потоков в модели и изменений — показаны первые точки входа и их вызовы."};
}
let tour = null;
function tourOptions() {
  const opts = [];
  (M.flows || []).forEach((fl, i) => { if ((fl.steps || []).some(id => fns[id])) opts.push([`flow:${i}`, "Поток: " + fl.name]); });
  if (changed.length) opts.push(["changes", "Изменённые функции (обход от входов)"]);
  if (entries.length) opts.push(["overview", "Обзор от точек входа"]);
  return opts;
}
const modeOptionsHTML = opts => opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("");
function setupPlayer() {
  const opts = tourOptions();
  $("#pMode").innerHTML = modeOptionsHTML(opts);
  loadMode(opts.length ? opts[0][0] : null);
}
// после обновления данных: тот же режим и тот же шаг (по id функции), проигрывание не прерывается
function refreshTour() {
  const prev = S.mode, curId = S.idx >= 0 ? S.steps[S.idx] : null;
  const opts = tourOptions();
  $("#pMode").innerHTML = modeOptionsHTML(opts);
  if (!opts.some(o => o[0] === prev)) { setupPlayer(); return; }
  $("#pMode").value = prev;
  S.steps = buildTour(prev).steps;
  const i = curId ? S.steps.indexOf(curId) : -1;
  if (curId && i < 0) { loadMode(prev); return; }
  S.idx = i;
  $("#pbar").max = Math.max(0, S.steps.length - 1); $("#pbar").value = Math.max(0, i);
  $("#pPos").textContent = (i >= 0 ? i + 1 : 0) + "/" + S.steps.length;
}
function loadMode(kind) {
  pause();
  S.mode = kind; S.idx = -1;
  tour = kind ? buildTour(kind) : {steps: [], name: "", desc: ""};
  S.steps = tour.steps;
  $("#pbar").max = Math.max(0, S.steps.length - 1); $("#pbar").value = 0;
  $("#pPos").textContent = "0/" + S.steps.length;
  $("#cap").innerHTML = S.steps.length ? `<span class="t">${esc(tour.name)}</span> <span class="s">— ${S.steps.length} шаг. ${esc(tour.desc)} Нажмите ▶.</span>` : '<span class="s">Нет данных для проигрывания.</span>';
  gOver.textContent = "";
  if (S.tab === "play") renderSide();
  paintMap();
}
function goStep(i) {
  if (!S.steps.length) return;
  i = Math.max(0, Math.min(S.steps.length - 1, i));
  S.idx = i;
  const id = S.steps[i], f = fns[id];
  $("#pbar").value = i; $("#pPos").textContent = (i + 1) + "/" + S.steps.length;
  const nx = S.steps[i + 1];
  const call = nx ? ((f.callees || []).includes(nx) ? `вызывает → <b>${esc(fname(fns[nx]))}</b>` : `далее → <b>${esc(fname(fns[nx]))}</b>`) : "конец";
  const mi = MM[f.module];
  $("#cap").innerHTML = `<span class="t">${i + 1}. ${esc(fname(f))}</span>` +
    (f.status ? ` <span class="tag" style="color:var(--${f.status === "added" ? "add" : "mod"})">${STATUS_RU[f.status]}</span>` : "") +
    (f.entry ? ` <span class="tag" style="color:var(--acc)">⚑ ${esc(f.entry.labels[0] || f.entry.kind)}</span>` : "") +
    `<br><span class="s">${esc(modLabel(f.module))}${mi && mi.role ? " — " + esc(mi.role) : ""}${isGid(unitOf[f.module] || "") ? " · группа <b>" + esc(U[unitOf[f.module]].node.path) + "</b>" : ""} ·<code>${esc(f.file)}:${f.start}</code> · ${call}</span>` +
    (f.doc ? `<br><span class="s">${esc(f.doc.split("\n")[0].slice(0, 200))}</span>` : "");
  S.fn = id; S.mod = f.module;
  renderDetail(); paintMap(); panTo(f.module);
  if (S.tab === "play") { renderSide(); const r = side.querySelector(".row.sel"); if (r) r.scrollIntoView({block: "nearest"}); }
}
function tick() {
  if (S.idx >= S.steps.length - 1) { pause(); return; }
  goStep(S.idx + 1);
  if (S.idx >= S.steps.length - 1) pause();
}
function play() {
  if (!S.steps.length) return;
  if (S.idx >= S.steps.length - 1) S.idx = -1;
  S.playing = true; $("#pPlay").textContent = "⏸";
  if (S.idx < 0) goStep(0);
  clearInterval(S.timer);
  S.timer = setInterval(tick, 1700 / +$("#pSpeed").value);
}
function pause() { S.playing = false; clearInterval(S.timer); $("#pPlay").textContent = "▶"; }
$("#pPlay").onclick = () => S.playing ? pause() : play();
$("#pNext").onclick = () => { pause(); goStep(S.idx + 1); };
$("#pPrev").onclick = () => { pause(); goStep(S.idx - 1); };
$("#pSpeed").onchange = () => { if (S.playing) play(); };
$("#pMode").onchange = e => { loadMode(e.target.value); if (S.tab !== "play") { S.tab = "play"; renderSide(); } };
$("#pbar").oninput = e => { pause(); goStep(+e.target.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "search") return;
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); S.playing ? pause() : play(); }
  else if (e.key === "ArrowRight") { pause(); goStep(S.idx + 1); }
  else if (e.key === "ArrowLeft") { pause(); goStep(S.idx - 1); }
});

/* ---------- живой режим (archmap serve) ---------- */
// Данные приходят по SSE-уведомлению; состояние (выбор, раскрытые группы, камера, фильтры,
// проигрывание) не трогаем — перестраиваются индексы, раскладка и списки.
function applyData(d, flashIds) {
  const focusId = S.focus ? S.focus.id : null, sc = side.scrollTop;
  F = d.facts; M = d.model || {};
  indexData(); drawHeader();
  allMods = Object.keys(F.modules);
  grouping = allMods.length > GROUP_MIN;
  Object.keys(TN).forEach(k => delete TN[k]); Object.keys(modNode).forEach(k => delete modNode[k]); initOpen.clear();
  TROOT = grouping ? buildTrie() : null;
  [...userOpen].forEach(id => { if (!TN[id]) userOpen.delete(id); });
  S.focus = grouping && focusId && TN[focusId] ? TN[focusId] : null;
  if (S.fn && !fns[S.fn]) S.fn = null;
  S.hist = S.hist.filter(id => fns[id]);
  if (S.mod && !byMod[S.mod] && !modChg[S.mod] && !hasFiles(S.mod)) S.mod = null;
  if (S.fMod && !byMod[S.fMod]) S.fMod = null;
  startFlash(flashIds || []);
  rebuild(); refreshTour();
  renderCrumbs(); renderDetail(); renderSide(); paintMap();
  side.scrollTop = sc;
}
function startFlash(ids) {
  const live = ids.filter(id => fns[id]);
  clearTimeout(flash.timer);
  flash.set = new Set(live); flash.mods = new Set(live.map(id => fns[id].module));
  if (!live.length) return;
  $("#detail").classList.remove("flash");
  if (S.fn && flash.set.has(S.fn)) { void $("#detail").offsetWidth; $("#detail").classList.add("flash"); }
  flash.timer = setTimeout(() => {
    flash.set = new Set(); flash.mods = new Set();
    document.querySelectorAll(".flash").forEach(e => e.classList.remove("flash"));
  }, 2800);
}
function setupLive() {
  const box = $("#live"), label = box.querySelector("b"), info = $("#liveInfo");
  const status = (st, text, tip) => { box.hidden = false; box.className = "live" + (st === "ready" ? "" : " " + st); label.textContent = text; box.title = tip || ""; };
  let seq = LIVE.seq || 0, want = seq, busy = false;
  const last = {ms: 0};
  const pend = new Set();
  const pull = async () => {
    if (busy) return;
    busy = true;
    let tip = "";
    try {
      while (seq !== want) {
        const r = await fetch(LIVE.data, {cache: "no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        seq = d.seq; if (seq > want) want = seq;
        const ids = [...pend]; pend.clear();
        applyData(d, ids);
        info.textContent = " · " + new Date().toLocaleTimeString() + (last.ms ? " · " + last.ms + " мс" : "") + (ids.length ? " · изменено: " + ids.length : "");
        tip = ids.slice(0, 12).map(id => fname(fns[id] || {name: id})).join("\n");
      }
      status("ready", "живое", tip);
    } catch (e) { status("error", "ошибка", String(e)); }
    finally { busy = false; }
  };
  status("ready", "живое");
  const es = new EventSource(LIVE.events);
  es.onmessage = ev => {
    const u = JSON.parse(ev.data);
    if (u.state === "building") { status("building", "пересборка…"); return; }
    if (u.state === "error") { status("error", "ошибка", u.error || ""); info.textContent = " · " + (u.error || "").slice(0, 80); return; }
    (u.flash || []).forEach(id => pend.add(id));
    last.ms = u.ms || 0;
    if (u.seq !== seq) { want = u.seq; pull(); } else status("ready", "живое");
  };
  es.onerror = () => status("error", "нет связи", "сервер archmap serve недоступен, переподключаюсь…");
}
