<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title><!--TITLE--></title>
<!--@CSS-->
</head>
<body>
<div class="app">
  <header>
    <button class="brand" id="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="8" height="6" rx="2" fill="var(--in)"/><rect x="14" y="3" width="8" height="6" rx="2" fill="var(--dom)"/><rect x="8" y="15" width="8" height="6" rx="2" fill="var(--ad)"/><path d="M6 9v3h12V9M12 12v3" stroke="var(--text-2)" stroke-width="1.5" fill="none"/></svg>
      <b id="repoName"><!--TITLE--></b><i class="live" id="live" hidden></i>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="breadcrumbs"></nav>
    <div class="search" id="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" autocomplete="off" spellcheck="false" role="combobox" aria-controls="qpop" aria-expanded="false"><kbd>⌘K</kbd>
      <div class="qpop" id="qpop" role="listbox" hidden></div>
    </div>
  </header>
  <main>
    <section class="stage" id="stage">
      <div class="view on" id="v-map">
        <div class="scene" id="sc0"></div><div class="scene hidden" id="sc1"></div><div class="scene hidden" id="sc2"></div><div class="scene hidden" id="sc3"></div>
        <div class="zoomctl"><button class="iconbtn" id="zIn">+</button><button class="iconbtn" id="zOut">−</button><button class="iconbtn" id="zFit">⤢</button></div>
      </div>
    </section>
    <aside id="panel"><div class="pgrip" id="panelGrip" role="separator" aria-orientation="vertical" tabindex="0"></div><button class="iconbtn phide" id="panelHide">✕</button><div class="pane" id="pane"></div></aside>
  </main>
  <footer class="player" id="player" hidden>
    <span class="pname" id="scName"></span>
    <button class="pbtn" id="pPrev">←</button>
    <span class="pstep" id="capNo"></span>
    <button class="pbtn" id="pStep">→</button>
    <span class="ptext" id="capTx"></span>
    <span class="choice" id="choice"></span>
    <button class="pbtn pclose" id="pClose">✕</button>
  </footer>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".07"/></filter>
  <filter id="sh2" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity=".06"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--edge)"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--text-2)"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--muted)"/></marker>
  <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--serious)"/></marker>
  <marker id="arrA"viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--accent)"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--text-2)" stroke-width="1.4"/></marker>
</defs></svg>
<script>
"use strict";
const DATA = /*ARCH_DATA*/null;
<!--@JS-->
</script>
</body>
</html>
