<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<title><!--TITLE--></title>
<!--@CSS-->
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="8" height="6" rx="2" fill="var(--in)"/><rect x="14" y="3" width="8" height="6" rx="2" fill="var(--dom)"/><rect x="8" y="15" width="8" height="6" rx="2" fill="var(--ad)"/><path d="M6 9v3h12V9M12 12v3" stroke="var(--text-2)" stroke-width="1.5" fill="none"/></svg>
      <b id="repoName"><!--TITLE--></b><span class="meta" id="repoMeta"></span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="search" id="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" autocomplete="off" spellcheck="false" role="combobox" aria-controls="qpop" aria-expanded="false"><kbd>/</kbd>
      <div class="qpop" id="qpop" role="listbox" hidden></div>
    </div>
    <button class="iconbtn" id="listBtn" aria-haspopup="true" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span></span></button>
    <button class="iconbtn" id="flowsBtn" hidden></button>
    <div class="spacer"></div>
    <button class="iconbtn" id="moreBtn" hidden aria-haspopup="true" aria-expanded="false">⋯</button>
    <div class="chg" id="chg"></div>
    <span class="live" id="live" hidden><i></i><b></b><span id="liveInfo"></span></span>
    <div class="seg" id="langSeg"><button data-l="ru" aria-pressed="false">RU</button><button data-l="en" aria-pressed="false">EN</button></div>
    <button class="iconbtn" id="themeBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>
  <main>
    <section class="stage" id="stage">
      <div class="view on" id="v-map">
        <div class="crumbs" id="crumbs"></div>
        <div class="jv-tag" id="jvTag" hidden></div>
        <div class="levelbar"><button class="iconbtn zsw" id="btnAuto" aria-pressed="true"></button><button class="iconbtn" id="btnUp"></button><button class="iconbtn primary" id="btnIn"></button></div>
        <div class="scene" id="sc0"></div><div class="scene hidden" id="sc1"></div><div class="scene hidden" id="sc2"></div><div class="scene hidden" id="sc3"></div>
        <div class="minimap off" id="minimap"></div>
        <div class="legend off" id="legend"></div>
        <div class="zoomctl"><button class="iconbtn" id="zIn">+</button><button class="iconbtn" id="zOut">−</button><button class="iconbtn" id="zFit">⤢</button></div>
      </div>
      <div class="lists" id="lists" hidden></div>
    </section>
    <aside id="panel"><div class="pane" id="pane"></div></aside>
  </main>
  <footer class="player" id="player">
    <div class="scen" id="pcombo">
      <button class="scbtn" id="pcur" aria-haspopup="listbox" aria-expanded="false"><span class="nm" id="scName"></span><span class="ac" id="scActor"></span></button>
      <div class="ppop" id="ppop" hidden><input type="search" id="pq" autocomplete="off" role="combobox" aria-controls="plist"><div id="plist" role="listbox"></div></div>
    </div>
    <div class="pgroup">
      <button class="pbtn" id="pPrev" title="←">◀</button>
      <button class="pbtn" id="pStep"></button>
      <button class="pbtn" id="pIn"></button>
      <button class="pbtn" id="pOut"></button>
      <button class="pbtn primary" id="pAuto"></button>
      <span class="speed"><select id="pSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></span>
    </div>
    <div class="track">
      <div class="ticks" id="ticks"></div>
      <div class="caption"><span class="no" id="capNo"></span><span class="tx" id="capTx"></span><span id="capMut"></span><span id="capSt"></span>
        <span class="choice" id="choice"></span></div>
    </div>
    <div class="pgroup"><button class="pbtn" id="pReset" title="Home">⟲</button></div>
  </footer>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".07"/></filter>
  <filter id="sh2" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity=".06"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--edge)"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--text-2)"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--muted)"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--accent)"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--text-2)" stroke-width="1.4"/></marker>
</defs></svg>
<script>
"use strict";
const DATA = /*ARCH_DATA*/null;
<!--@JS-->
</script>
</body>
</html>
